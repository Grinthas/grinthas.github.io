name: Грибная ферма -> APK

# Собирает APK для Android и кладёт его в раздел Releases (тег mushroom-farm-latest).
# Запускается само, когда меняются файлы в mushroom_farm/, или вручную (Actions -> Run workflow).

on:
  push:
    paths:
      - "mushroom_farm/**"
      - ".github/workflows/mushroom-farm-apk.yml"
      - ".github/android/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mushroom-farm-apk
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"

      - name: Godot и шаблоны экспорта (кэш)
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-v1

      - name: Скачать Godot, если нет в кэше
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          if [ ! -x "$HOME/godot-bin/godot" ]; then
            mkdir -p "$HOME/godot-bin"
            curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d /tmp/godot-unzip
            mv /tmp/godot-unzip/Godot_v${GODOT_VERSION}-stable_linux.x86_64 "$HOME/godot-bin/godot"
            chmod +x "$HOME/godot-bin/godot"
          fi
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -f "$TPL/android_debug.apk" ]; then
            curl -fsSL -o /tmp/tpl.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            mkdir -p "$TPL" /tmp/tpl
            unzip -q /tmp/tpl.tpz -d /tmp/tpl
            mv /tmp/tpl/templates/* "$TPL/"
          fi
          ls "$TPL" | head -30

      - name: Настроить Godot для Android
        run: |
          CFG="$HOME/.config/godot"
          mkdir -p "$CFG"
          for name in editor_settings-4.tres editor_settings-${GODOT_VERSION}.tres; do
            cat > "$CFG/$name" <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/.github/android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          TRES
          done
          sed -i 's/^ *//' "$CFG"/editor_settings-*.tres
          cat "$CFG/editor_settings-4.tres"

      - name: Номер версии
        run: sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"1.${{ github.run_number }}\"/" mushroom_farm/export_presets.cfg

      - name: Собрать APK
        run: |
          mkdir -p build
          cd mushroom_farm
          ls "$SDK" "$SDK/build-tools" "$SDK/platforms" "$SDK/platform-tools" | head -40
          "$HOME/godot-bin/godot" --headless --import || true
          "$HOME/godot-bin/godot" --headless --verbose --export-debug "Android" ../build/mushroom-farm.apk
          ls -la ../build

      - name: Опубликовать в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mushroom-farm-latest --cleanup-tag -y || true
          gh release create mushroom-farm-latest build/mushroom-farm.apk \
            --title "Грибная ферма (APK)" \
            --notes "Сборка №${{ github.run_number }}, коммит ${GITHUB_SHA::7}. Скачай mushroom-farm.apk и установи." \
            --target "$GITHUB_SHA" \
            --prerelease

      - uses: actions/upload-artifact@v4
        with:
          name: mushroom-farm-apk
          path: build/mushroom-farm.apk
