name: CurseForge -> Discord + site

on:
  schedule:
    - cron: "17 * * * *"  # раз в час
  push:
    branches: [main]
    paths: ["mods.txt", "site/**", "*.py", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  models: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить новые моды
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CF_AUTHOR: Grint
        run: python notify.py
      - name: Сохранить sent.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.json
          git diff --cached --quiet || (git commit -m "Обновить список отправленных модов" && git push)

  site:
    needs: notify
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать сайт
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          MODELS_TOKEN: ${{ github.token }}
        run: python build_site.py
      - name: Сохранить новые переводы
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations
          git diff --cached --quiet || (git commit -m "Обновить переводы описаний" && git pull --rebase && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
