<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="google-site-verification" content="Foj5FLrxu88ChlxRMbV2-N2e0rGw71T3A8Xjw_IU4sc" />
<link rel="canonical" href="{{URL}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{URL}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ROOT}}style.css?v={{CSSV}}">
<script>
  // язык: сохранённый выбор, иначе язык браузера
  (function () {
    var l = null;
    try { l = localStorage.getItem("lang"); } catch (e) {}
    if (!l) l = (navigator.language || "en").toLowerCase().indexOf("ru") === 0 ? "ru" : "en";
    document.documentElement.lang = l;
  })();
</script>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="{{ROOT}}">Grint</a>
    <nav class="mods"><a class="suggest" href="{{ROOT}}modpacks/"><span lang="en">Modpacks</span><span lang="ru">Сборки</span></a><a class="suggest" href="{{ROOT}}suggestions/"><span lang="en">Suggestions</span><span lang="ru">Предложения</span></a>{{NAV}}</nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ru">RU</button>
    </div>
  </div>
</header>

<main class="wrap">
{{MAIN}}
</main>

<footer class="wrap">
  <span lang="en">Files are served from CurseForge. Updated {{BUILT}}.</span>
  <span lang="ru">Файлы раздаются с CurseForge. Обновлено {{BUILT}}.</span>
</footer>

<script>
  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.documentElement.lang = b.dataset.lang;
      try { localStorage.setItem("lang", b.dataset.lang); } catch (e) {}
    });
  });
  // колесико мыши прокручивает меню и скриншоты вбок, когда они не помещаются
  document.querySelectorAll("nav.mods, .shots").forEach(function (el) {
    el.addEventListener("wheel", function (e) {
      if (el.scrollWidth <= el.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      el.scrollLeft += e.deltaY;
      e.preventDefault();
    }, { passive: false });
  });

  // скриншоты открываются поверх страницы: стрелки листают, Esc или клик мимо закрывает
  var shots = Array.prototype.slice.call(document.querySelectorAll(".shots a"));
  if (shots.length) {
    var box = document.createElement("div");
    box.className = "lightbox";
    box.hidden = true;
    box.innerHTML = '<button class="lb-close" aria-label="Close">✕</button>' +
      '<button class="lb-prev" aria-label="Previous">‹</button><img alt=""><button class="lb-next" aria-label="Next">›</button>';
    document.body.appendChild(box);
    var img = box.querySelector("img"), cur = 0;
    function show(i) {
      cur = (i + shots.length) % shots.length;
      img.src = shots[cur].href;
      img.alt = shots[cur].querySelector("img").alt;
      box.hidden = false;
      document.body.style.overflow = "hidden";
    }
    function close() { box.hidden = true; img.src = ""; document.body.style.overflow = ""; }
    shots.forEach(function (a, i) {
      a.addEventListener("click", function (e) { e.preventDefault(); show(i); });
    });
    box.querySelector(".lb-prev").onclick = function (e) { e.stopPropagation(); show(cur - 1); };
    box.querySelector(".lb-next").onclick = function (e) { e.stopPropagation(); show(cur + 1); };
    box.addEventListener("click", function (e) { if (e.target !== img) close(); });
    document.addEventListener("keydown", function (e) {
      if (box.hidden) return;
      if (e.key === "Escape") close();
      else if (e.key === "ArrowLeft") show(cur - 1);
      else if (e.key === "ArrowRight") show(cur + 1);
    });
  }
</script>
</body>
</html>
