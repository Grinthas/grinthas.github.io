<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{URL}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{URL}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ROOT}}style.css?v={{CSSV}}">
<script>
  // язык: сохранённый выбор, иначе язык браузера
  (function () {
    var l = null;
    try { l = localStorage.getItem("lang"); } catch (e) {}
    if (!l) l = (navigator.language || "en").toLowerCase().indexOf("ru") === 0 ? "ru" : "en";
    document.documentElement.lang = l;
  })();
</script>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="{{ROOT}}">Grint</a>
    <nav class="mods">{{NAV}}</nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ru">RU</button>
    </div>
  </div>
</header>

<main class="wrap">
{{MAIN}}
</main>

<footer class="wrap">
  <span lang="en">Files are served from CurseForge. Updated {{BUILT}}.</span>
  <span lang="ru">Файлы раздаются с CurseForge. Обновлено {{BUILT}}.</span>
</footer>

<script>
  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.documentElement.lang = b.dataset.lang;
      try { localStorage.setItem("lang", b.dataset.lang); } catch (e) {}
    });
  });
</script>
</body>
</html>
